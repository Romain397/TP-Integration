name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tp1:
    name: TP1 lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TP1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python manage.py test
  tp2:
    name: TP2 lint, tests, and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TP2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: coverage run manage.py test
      - run: coverage report --fail-under=80
