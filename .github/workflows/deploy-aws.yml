name: Deploy AWS
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  checks:
    if: vars.AWS_ENABLED == 'true'
    uses: ./.github/workflows/ci.yml
  codeql:
    if: vars.AWS_ENABLED == 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
  deploy:
    if: vars.AWS_ENABLED == 'true' && github.ref == 'refs/heads/main'
    needs: [checks, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: ecs-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
      ECS_EXECUTION_ROLE_ARN: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
      ECS_TASK_ROLE_ARN: ${{ vars.ECS_TASK_ROLE_ARN }}
      CLOUDWATCH_LOG_GROUP: ${{ vars.CLOUDWATCH_LOG_GROUP }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vérifier les variables de configuration
        run: |
          for name in AWS_REGION AWS_ROLE_ARN ECR_REPOSITORY ECS_CLUSTER ECS_SERVICE ECS_TASK_FAMILY ECS_EXECUTION_ROLE_ARN ECS_TASK_ROLE_ARN CLOUDWATCH_LOG_GROUP; do
            test -n "${!name}" || { echo "Variable absente : $name"; exit 1; }
          done
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./TP3
          load: true
          push: false
          tags: devsecops-tp:${{ github.sha }}
          cache-from: type=gha,scope=tp3
      - name: Scanner l'image exacte avant publication
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          image-ref: devsecops-tp:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        id: ecr
      - name: Publier l'image identifiée par le commit
        id: push
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          image="$ECR_REGISTRY/$ECR_REPOSITORY:$COMMIT_SHA"
          docker tag "devsecops-tp:$COMMIT_SHA" "$image"
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Préparer la définition de tâche
        run: |
          jq --arg family "$ECS_TASK_FAMILY" \
             --arg executionRole "$ECS_EXECUTION_ROLE_ARN" \
             --arg taskRole "$ECS_TASK_ROLE_ARN" \
             --arg logGroup "$CLOUDWATCH_LOG_GROUP" \
             --arg region "$AWS_REGION" \
             '.family = $family | .executionRoleArn = $executionRole | .taskRoleArn = $taskRole |
              .containerDefinitions[0].logConfiguration.options["awslogs-group"] = $logGroup |
              .containerDefinitions[0].logConfiguration.options["awslogs-region"] = $region' \
             TP3/aws/task-definition.json > "$RUNNER_TEMP/task-definition.json"
      - uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1
        id: task
        with:
          task-definition: ${{ runner.temp }}/task-definition.json
          container-name: api
          image: ${{ steps.push.outputs.image }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2
        with:
          task-definition: ${{ steps.task.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
