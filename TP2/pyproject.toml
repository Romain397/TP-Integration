[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "order-pricing-api"
version = "1.0.0"
description = "Moteur de tarification et API de commandes, exercice TDD"
requires-python = ">=3.12"
dependencies = ["Django>=5.2,<7"]

[project.optional-dependencies]
dev = ["ruff>=0.6,<1", "coverage>=7.6,<8"]

[tool.setuptools.packages.find]
include = ["config*", "orders*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.run]
branch = true
source = ["orders"]

[tool.coverage.report]
fail_under = 80
show_missing = true
